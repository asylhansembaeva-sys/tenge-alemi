<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="Ұлттық валюта – теңге | Ойын"><title>Ұлттық валюта – теңге</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Times New Roman',serif;background:radial-gradient(circle at 20% 0,#fff6a3,transparent 40%),linear-gradient(120deg,#7de5ff,#d6c4ff 50%,#92ffbf);color:#112f79}header{text-align:center;padding:10px}h1{font-size:clamp(30px,4vw,58px);margin:5px;color:#1839bb;text-shadow:2px 3px #fff}h2{font-size:clamp(30px,3.5vw,45px);color:#bb1253;margin:12px}button{font-family:inherit;cursor:pointer;font-weight:900}.nav{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.nav button,.action{background:#ffdd34;border:4px solid white;box-shadow:0 4px #b98818;border-radius:16px;padding:9px 20px;font-size:clamp(20px,2.3vw,29px);color:#183ea1}.nav button.active{background:#ff5f9f;color:white}.wrap{max-width:1560px;margin:auto;padding:8px 16px 25px}.panel{border:5px solid #2591ef;background:#fffffff0;border-radius:26px;text-align:center;padding:12px;margin:12px auto}.wallets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}.wallet{position:relative;min-width:0;min-height:230px;border:4px dashed transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;touch-action:none}.wallet img{width:100%;max-width:490px;object-fit:contain;display:block;pointer-events:none}.wallet.dragover{border-color:#ffb400;background:#fff5a8}.wallet .count{position:absolute;bottom:0;right:8px;font-size:clamp(17px,2vw,27px);font-weight:bold;background:#fffde8;border:3px solid #2457ba;border-radius:30px;padding:2px 10px}.wallet.ok{filter:drop-shadow(0 0 14px #ffd000)}.wallet.just-hit{animation:walletPulse .8s ease}.wallet .deposits{position:absolute;bottom:0;left:2%;right:2%;min-height:45px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}.wallet .deposits img{width:auto;height:clamp(26px,3.4vw,51px);max-width:32%;filter:drop-shadow(1px 2px 2px #333);background:#fff9;border:2px solid #fff;border-radius:8px}.wallet .count{bottom:45px!important;right:8px!important;background:#fff7b0!important;color:#122d78}.wallet .wallet-label{position:absolute;bottom:4px;left:10px;color:white;font-weight:900;font-size:clamp(13px,1.5vw,21px);text-shadow:1px 2px 3px #172a55}.money img{height:clamp(75px,7.4vw,108px)!important;max-width:clamp(140px,12vw,210px)!important;width:auto!important}.money{min-width:100px!important;min-height:90px!important;padding:6px!important;overflow:hidden}.tray{gap:12px!important}.chosen .money img{height:70px!important}.chosen .money{min-height:80px!important}@keyframes walletPulse{0%,100%{transform:scale(1)}35%{transform:scale(1.055);filter:drop-shadow(0 0 24px #ffd900)}}.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding:12px 0;min-height:90px}.money{-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;border:3px solid #2475bd;background:white;border-radius:16px;min-width:76px;min-height:68px;padding:4px;box-shadow:0 4px 0 #9ac2e6}.money img{height:66px;max-width:124px;object-fit:contain;pointer-events:none}.money.used{opacity:.25;pointer-events:none}.money.selected{outline:5px solid #ffbc00}.money:active{transform:scale(.95)}#s2 .tray .money img{height:clamp(84px,8vw,125px)!important;max-width:clamp(150px,13vw,230px)!important}#s2 .tray .money{min-height:104px!important;min-width:105px!important}.item{height:clamp(220px,35vh,390px);width:auto;max-width:90%;object-fit:contain}.price{font-size:clamp(33px,4.3vw,56px);font-weight:900;color:#d0154c}.chosen{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;min-height:90px;border:4px dashed #e59cce;border-radius:19px;padding:8px;background:#fff9d8}.chosen .money{min-width:65px}.chosen .money img{height:54px}.status{font-size:clamp(20px,2.6vw,32px);font-weight:bold;min-height:40px}.actions{display:flex;justify-content:center;gap:12px;margin:8px;flex-wrap:wrap}.hidden{display:none!important}.flash{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(46px,8vw,110px);font-weight:900;color:#f30c68;text-shadow:4px 4px white;z-index:20;animation:pop 1.2s ease forwards}.spark{position:fixed;z-index:19;pointer-events:none;font-size:36px;animation:fly 1.25s ease-out forwards}@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.6)}}@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.15);opacity:1}85%{opacity:1}100%{opacity:0}}@media(max-width:650px){.money{min-width:74px!important;min-height:65px!important;padding:3px!important}.money img{height:65px!important;max-width:110px!important}.wallet .deposits{min-height:28px}.wallet .deposits img{height:24px}.wallet .count{bottom:29px!important;font-size:13px!important}.wallet .wallet-label{font-size:10px}.tray{gap:6px!important}.wrap{padding:5px}.wallets{gap:2px}.wallet{min-height:125px}.wallet .count{font-size:13px;padding:1px 5px}.panel{padding:7px}.money{min-width:65px}.money img{height:53px;max-width:96px}#s2 .tray .money img{height:clamp(84px,8vw,125px)!important;max-width:clamp(150px,13vw,230px)!important}#s2 .tray .money{min-height:104px!important;min-width:105px!important}.item{height:230px}}

/* Ірі, толық карточкаға сыйған теңге суреттері */
#tray1,#tray2{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:14px 3px}
#tray1 .money,#tray2 .money{width:clamp(105px,11vw,174px)!important;height:clamp(104px,10vw,151px)!important;min-width:0!important;min-height:0!important;padding:4px!important;flex:0 0 auto;overflow:hidden;border:3px solid #2878c4;border-radius:13px;box-sizing:border-box}
#tray1 .money img,#tray2 .money img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;display:block}
#tray1 .money:has(img[src*="money_500."]),#tray1 .money:has(img[src*="money_1000."]),#tray1 .money:has(img[src*="money_2000."]),#tray1 .money:has(img[src*="money_5000."]),#tray2 .money:has(img[src*="money_500."]),#tray2 .money:has(img[src*="money_1000."]),#tray2 .money:has(img[src*="money_2000."]),#tray2 .money:has(img[src*="money_5000."]){width:clamp(155px,17vw,245px)!important}
#tray1 .money:has(img[src*="money_500."]) img,#tray1 .money:has(img[src*="money_1000."]) img,#tray1 .money:has(img[src*="money_2000."]) img,#tray1 .money:has(img[src*="money_5000."]) img,#tray2 .money:has(img[src*="money_500."]) img,#tray2 .money:has(img[src*="money_1000."]) img,#tray2 .money:has(img[src*="money_2000."]) img,#tray2 .money:has(img[src*="money_5000."]) img{object-fit:fill!important}
@media(max-width:650px){#tray1 .money,#tray2 .money{width:91px!important;height:88px!important}#tray1 .money:has(img[src*="money_500."]),#tray1 .money:has(img[src*="money_1000."]),#tray1 .money:has(img[src*="money_2000."]),#tray1 .money:has(img[src*="money_5000."]),#tray2 .money:has(img[src*="money_500."]),#tray2 .money:has(img[src*="money_1000."]),#tray2 .money:has(img[src*="money_2000."]),#tray2 .money:has(img[src*="money_5000."]){width:145px!important}}
.action:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}#s2 .chosen .money{cursor:default}#s2 .actions{gap:18px}#s2 .status{color:#c3155c}</style></head><body><header><h1>ҰЛТТЫҚ ВАЛЮТА – ТЕҢГЕ</h1><nav class="nav"><button id="nav1" class="active" onclick="showStage(1)">1-КЕЗЕҢ</button><button id="nav2" onclick="showStage(2)">2-КЕЗЕҢ</button></nav></header><main class="wrap"><section id="s1" class="panel"><h2>Ақшаны әмиянға жина!</h2><div class="wallets"><div class="wallet" data-group="0"><img src="assets/wallet_red.png"><span class="count" id="count0">0 / 3</span><div class="deposits" id="deposits0"></div></div><div class="wallet" data-group="1"><img src="assets/wallet_blue.png"><span class="count" id="count1">0 / 3</span><div class="deposits" id="deposits1"></div></div><div class="wallet" data-group="2"><img src="assets/wallet_green.png"><span class="count" id="count2">0 / 3</span><div class="deposits" id="deposits2"></div></div></div><div class="tray" id="tray1"></div><div class="status" id="status1"></div><div class="actions"><button class="action" onclick="resetWallets()">ҚАЙТА ОЙНАУ</button><button class="action" onclick="showStage(2)">2-КЕЗЕҢГЕ ӨТУ ➜</button></div></section><section id="s2" class="panel hidden"><h2>ДҮКЕН</h2><div class="status" id="progress"></div><img id="product" class="item"><div id="price" class="price"></div><div class="chosen" id="chosen"></div><div class="status" id="status2"></div><div class="tray" id="tray2"></div><div class="actions"><button class="action" onclick="clearChosen()">БАСҚАША ТӨЛЕ</button><button class="action" id="checkProduct" onclick="checkShop()">ТЕКСЕРУ</button><button class="action" id="nextProduct" onclick="nextShop()">КЕЛЕСІ ➜</button></div></section></main><script>
const denominations=[5,10,20,50,100,500,1000,2000,5000];const groups=[[5,10,20],[50,100,500],[1000,2000,5000]];const products=[['Көйлек','dress',2000],['Ойыншық машина','car',600],['Конструктор','blocks',300],['Нан','bread',50],['Ойыншық аю','bear',500],['Шар','balloons',400],['Балмұздақ','icecream',300],['Шоколад','chocolate',150],['Банан','banana',200],['Чупа-чупс','lollipop',100]];let stage=1,walletDone=new Set(),productIndex=0,selected=[],locked=false,drag=null,audioCtx=null,shopTimer=null,shopCompleted=false;
function sound(good=true){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let t=audioCtx.currentTime;let notes=good?[523,659,784,1047]:[220,180];notes.forEach((n,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.16,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.2);o.connect(g).connect(audioCtx.destination);o.start(t+i*.11);o.stop(t+i*.11+.21)})}catch(e){}}
function celebrate(){sound(true);let label=document.createElement('div');label.className='flash';label.textContent='ЖАРАЙСЫҢ!';document.body.append(label);setTimeout(()=>label.remove(),1250);for(let i=0;i<30;i++){let s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🎉','🌟'][i%4];s.style.left=(20+Math.random()*60)+'vw';s.style.top=(20+Math.random()*55)+'vh';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*450-225)+'px');document.body.append(s);setTimeout(()=>s.remove(),1400)}}
function moneySVG(n){let coin=n<=200,fill=n<=10?'#e5af29':n<=50?'#a7b6c8':n===100?'#d3aa49':n===200?'#d1b276':n===500?'#77baf2':n===1000?'#d7b668':n===2000?'#76cbb2':'#ef9295';let svg=coin?`<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130"><defs><radialGradient id="g"><stop stop-color="#fffde4"/><stop offset=".68" stop-color="${fill}"/><stop offset="1" stop-color="#796039"/></radialGradient></defs><circle cx="65" cy="65" r="61" fill="url(#g)" stroke="#7a5b2b" stroke-width="5"/><circle cx="65" cy="65" r="53" fill="none" stroke="#fff8d5" stroke-width="3"/><text x="65" y="77" text-anchor="middle" font-family="Georgia" font-weight="bold" font-size="52" fill="#1e2430">${n}</text><text x="65" y="100" text-anchor="middle" font-family="Georgia" font-weight="bold" font-size="17">ТЕҢГЕ</text></svg>`:`<svg xmlns="http://www.w3.org/2000/svg" width="210" height="120" viewBox="0 0 210 120"><rect x="3" y="3" width="204" height="114" rx="9" fill="${fill}" stroke="#45637d" stroke-width="4"/><path d="M9 85 Q70 30 200 75" stroke="#ffffff88" stroke-width="13" fill="none"/><circle cx="162" cy="54" r="29" fill="none" stroke="#ffffff99" stroke-width="4"/><text x="15" y="49" font-family="Georgia" font-size="42" font-weight="bold" fill="#1d3864">${n}</text><text x="15" y="72" font-family="Georgia" font-size="17" font-weight="bold" fill="#193a57">ТЕҢГЕ</text><text x="154" y="66" text-anchor="middle" font-size="34" fill="#ffffffaa">✦</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
let activeDrag=null, suppressClickUntil=0;
function makeMoney(n,cb,id){
 const b=document.createElement('button');b.className='money';b.type='button';b.setAttribute('aria-label',n+' теңге');b.dataset.n=n;
 b.innerHTML=`<img alt="${n} теңге" draggable="false" src="assets/money_${n}.png">`;
 b.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();return}cb(n,b)});
 b.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   if(activeDrag)return;
   activeDrag={id:e.pointerId,n,button:b,x:e.clientX,y:e.clientY,moved:false,ghost:null};
   try{b.setPointerCapture(e.pointerId)}catch(_){}
 });
 b.addEventListener('pointermove',e=>{
   const d=activeDrag;if(!d||d.id!==e.pointerId||d.button!==b)return;
   if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>9){
     d.moved=true;d.ghost=b.cloneNode(true);d.ghost.removeAttribute('id');d.ghost.style.cssText='position:fixed;z-index:9999;pointer-events:none;opacity:.94;transform:scale(1.15);width:120px;';document.body.append(d.ghost);
   }
   if(d.moved){e.preventDefault();d.ghost.style.left=(e.clientX-60)+'px';d.ghost.style.top=(e.clientY-40)+'px';}
 });
 b.addEventListener('pointerup',e=>{
   const d=activeDrag;if(!d||d.id!==e.pointerId||d.button!==b)return;
   activeDrag=null;if(d.ghost)d.ghost.remove();
   if(!d.moved)return;
   suppressClickUntil=Date.now()+350;
   const target=document.elementFromPoint(e.clientX,e.clientY);
   if(stage===1){const w=target?.closest('.wallet');if(w)chooseWallet(n,Number(w.dataset.group));}
   else if(target?.closest('#chosen,#product,#s2'))chooseShop(n);
 });
 b.addEventListener('pointercancel',()=>{if(activeDrag?.button===b){activeDrag.ghost?.remove();activeDrag=null}});
 return b;
}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function showStage(n){cancelShopTimer();stage=n;document.getElementById('s1').classList.toggle('hidden',n!==1);document.getElementById('s2').classList.toggle('hidden',n!==2);document.getElementById('nav1').classList.toggle('active',n===1);document.getElementById('nav2').classList.toggle('active',n===2)}
function resetWallets(){walletDone.clear();let t=document.getElementById('tray1');t.innerHTML='';shuffle([...denominations]).forEach(n=>{let b=makeMoney(n,(num)=>{let g=groups.findIndex(x=>x.includes(num));chooseWallet(num,g)});b.id='w'+n;t.append(b)});groups.forEach((_,i)=>{document.getElementById('count'+i).textContent='0 / 3';document.querySelectorAll('.wallet')[i].classList.remove('ok','just-hit');document.getElementById('deposits'+i).innerHTML=''});document.getElementById('status1').textContent=''}
function chooseWallet(n,g){if(walletDone.has(n))return;let correct=groups[g].includes(n);if(!correct){sound(false);return}walletDone.add(n);let b=document.getElementById('w'+n);if(b)b.classList.add('used');let c=groups[g].filter(v=>walletDone.has(v)).length;document.getElementById('count'+g).textContent=c+' / 3';let wallet=document.querySelectorAll('.wallet')[g];wallet.classList.add('ok');wallet.classList.remove('just-hit');void wallet.offsetWidth;wallet.classList.add('just-hit');let deposited=document.createElement('img');deposited.src='assets/money_'+n+'.png';deposited.alt=n+' теңге';document.getElementById('deposits'+g).append(deposited);celebrate();if(walletDone.size===9)document.getElementById('status1').textContent='Барлық теңгені жинадың!'}
function renderShop(){cancelShopTimer();locked=false;shopCompleted=false;selected=[];let [name,file,price]=products[productIndex];document.getElementById('progress').textContent=(productIndex+1)+' / 10';document.getElementById('product').src='assets/'+file+'.png';document.getElementById('product').alt=name;document.getElementById('price').textContent=price+' тг';document.getElementById('status2').textContent='';document.getElementById('nextProduct').disabled=false;document.getElementById('chosen').innerHTML='';let t=document.getElementById('tray2');t.innerHTML='';denominations.forEach(n=>t.append(makeMoney(n,chooseShop)))}
function chooseShop(n){
 if(locked)return;
 let target=products[productIndex][2],sum=selected.reduce((a,b)=>a+b,0);
 if(sum+n>target){sound(false);document.getElementById('status2').textContent='Сома артық!';return}
 selected.push(n);document.getElementById('status2').textContent='';renderChosen();
}
function checkShop(){
 if(locked)return;
 const sum=selected.reduce((a,b)=>a+b,0),target=products[productIndex][2];
 if(sum!==target){sound(false);document.getElementById('status2').textContent=sum<target?'Ақша жеткіліксіз. Қайта санап көр!':'Ақша артық. Қайта санап көр!';return}
 locked=true;shopCompleted=true;document.getElementById('status2').textContent='';celebrate();
 // Салют көрініп үлгергеннен кейін келесі зат ашылады.
 shopTimer=setTimeout(()=>{shopTimer=null;if(stage===2&&locked)nextShop()},1600);
}
function cancelShopTimer(){if(shopTimer!==null){clearTimeout(shopTimer);shopTimer=null}}function renderChosen(){let c=document.getElementById('chosen');c.innerHTML='';selected.forEach((n,i)=>{c.append(makeMoney(n,()=>{if(locked)return;selected.splice(i,1);renderChosen()}))})}function clearChosen(){cancelShopTimer();locked=false;shopCompleted=false;selected=[];renderChosen();document.getElementById('nextProduct').disabled=false;document.getElementById('status2').textContent=''}function nextShop(){cancelShopTimer();productIndex=(productIndex+1)%products.length;renderShop()}function resetShop(){productIndex=0;renderShop()}resetWallets();renderShop();</script></body></html>
